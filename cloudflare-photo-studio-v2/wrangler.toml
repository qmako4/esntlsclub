name = "esntls-photo-studio-v2"
main = "src/worker.js"
compatibility_date = "2026-08-10"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./public", binding = "ASSETS" }

[[r2_buckets]]
binding = "ESNTLS_STUDIO_MEDIA"
bucket_name = "esntls-photo-studio-v2-media"
preview_bucket_name = "esntls-photo-studio-v2-media-preview"

[[r2_buckets]]
binding = "ESNTLS_CATALOG"
bucket_name = "esntls-images"

[[queues.producers]]
binding = "ESNTLS_STUDIO_QUEUE"
queue = "esntls-photo-studio-v2-jobs"

[[queues.consumers]]
queue = "esntls-photo-studio-v2-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 1
max_concurrency = 1
retry_delay = 30

[[services]]
binding = "ESNTLS_STORE_API"
service = "esntls-r2"

[vars]
ESNTLS_STUDIO_OPENAI_IMAGE_MODEL = "gpt-image-2"
ESNTLS_STUDIO_IMAGE_SIZE = "1200x1600"
ESNTLS_STUDIO_KEEP_CROP_IMAGE_SIZE = "1200x1600"
ESNTLS_STUDIO_IMAGE_QUALITY = "medium"
ESNTLS_STUDIO_OUTPUT_FORMAT = "jpeg"
ESNTLS_STUDIO_OUTPUT_COMPRESSION = "95"
ESNTLS_STUDIO_MAX_BULK_IMAGES = "24"
ESNTLS_STUDIO_YUPOO_IMPORT_LIMIT = "24"
ESNTLS_STUDIO_R2_PREFIX = "photo-studio-v2/"
ESNTLS_STUDIO_BACKGROUND_PATH = "/esntls-grass-background.jpg"
ESNTLS_STUDIO_SESSION_DAYS = "30"
ESNTLS_STUDIO_ALLOWED_ORIGINS = "https://esntlsclub.com,https://www.esntlsclub.com,https://esntls-photo-studio-v2.qmako41212.workers.dev,http://127.0.0.1:8787,http://localhost:8787"
ESNTLS_STUDIO_PUBLIC_URL = "https://esntls-photo-studio-v2.qmako41212.workers.dev"
ESNTLS_STUDIO_AUTO_CHECKOUT = "true"
ESNTLS_STUDIO_DEFAULT_DELIVERY = "7-12 Days"

[observability]
enabled = true
head_sampling_rate = 1
