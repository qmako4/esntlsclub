name: Recover live Cloudflare Worker

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: github.head_ref == 'codex/cloudflare-recovery' || github.ref == 'refs/heads/codex/cloudflare-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Download currently deployed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p recovered
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --dump-header recovered/response-headers.txt \
            --output recovered/esntls-r2-download.bin \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/esntls-r2"
          sed -i '/^set-cookie:/Id' recovered/response-headers.txt
          test -s recovered/esntls-r2-download.bin

      - name: Store recovered source
        uses: actions/upload-artifact@v4
        with:
          name: esntls-r2-live-source
          path: recovered/
          retention-days: 1
          if-no-files-found: error
